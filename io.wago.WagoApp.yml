id: io.wago.WagoApp

sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '24.08'
base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: start-wagoapp
separate-locales: false # this is provided by the AppImage and handled internally by the app

finish-args:
  # network access
  - --share=network
  # hardware acceleration
  - --device=dri
  # electron requirements (X11 + XShm)
  - --socket=x11
  - --share=ipc
  # tray icon support
  - --talk-name=org.kde.StatusNotifierWatcher
  # typical locations of game installations
  - --filesystem=~/.wine
  - --filesystem=~/Games # lutris
  - --filesystem=~/.var/app/net.lutris.Lutris/data/lutris
  - --filesystem=~/.var/app/com.usebottles.bottles/data/bottles
  - --filesystem=~/.var/app/heroicgameslauncher.hgl/data
  - --filesystem=~/.steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data
  - --filesystem=~/.PlayOnLinux
  - --filesystem=~/.var/app/com.playonlinux.PlayOnLinux4/data

modules:
  - name: WagoApp
    buildsystem: simple
    build-commands:
      # unpack AppImage
      - chmod +x WagoApp.AppImage
      - ./WagoApp.AppImage --appimage-extract
      # update desktop file to run wrapper script and update icon path
      - |
        desktop-file-edit --set-key=Exec --set-value="start-wagoapp %U" \
          --set-icon=$FLATPAK_ID squashfs-root/WagoApp.desktop
      # install desktop file
      - |
        install -D squashfs-root/WagoApp.desktop \
          "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      # install icons
      - |
        for size in 16 32 64 128 256 512; do
          install -D "icons/hicolor/${size}x${size}/apps/WagoApp.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
        install -D "icons/hicolor/scalable/apps/WagoApp.svg" \
          "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
      # fix desktop file keywords (this should be fixed in the AppImage in the future)
      - |
        desktop-file-edit --set-key=Keywords --set-value="addons,wow,warcraft,weakauras" \
          "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      # copy metadata file
      - install -D "${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo/"
      # install wrapper script
      - install -Dm755 start-wagoapp "${FLATPAK_DEST}/bin/start-wagoapp"
      # copy rest of the source
      - mv squashfs-root "${FLATPAK_DEST}/bin/wagoapp"
    sources:
      # app source
      - type: file
        dest-filename: WagoApp.AppImage
        url: https://wago-addons.ams3.digitaloceanspaces.com/wagoapp/WagoApp_2.6.4.AppImage
        sha256: 95058cba3c0ca7d9e0ff091d8cbad1e504934d9aa72459daf51070535ee473af
        only-arches:
          - x86_64
      # wrapper script
      - type: script
        dest-filename: start-wagoapp
        commands:
          - zypak-wrapper /app/bin/wagoapp/WagoApp "$@"
      # metadata
      - type: file
        path: io.wago.WagoApp.metainfo.xml
      # externally provided icons (these should be provided by the AppImage in the future)
      - type: dir
        path: icons
